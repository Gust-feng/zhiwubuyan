<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>知无不言</title>
    <script>
      (() => {
        try {
          const dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.dataset.style = "default";
          document.documentElement.dataset.color = dark ? "dark" : "light";
          document.documentElement.dataset.motion = "system";
        } catch {
          document.documentElement.dataset.style = "default";
          document.documentElement.dataset.color = "light";
        }
      })();
    </script>
    <style>
      html, body, #root { height: 100%; margin: 0; }
      body { background: #f6f7f9; color: #1a1a1a; font-family: "Noto Sans SC", Inter, system-ui, -apple-system, sans-serif; }
      html[data-color="dark"] body { background: #1b1b20; color: #e8e5e2; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
